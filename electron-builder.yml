appId: com.silmaril.skrive
productName: Skrive
copyright: Copyright © 2026 Minas Technologies / Silmaril Studio

directories:
  output: dist
  buildResources: build
  # electron-builder's auto-detection picks `./app/` as the app root
  # whenever an `app/` directory exists — the legacy "two package.json"
  # layout. Skrive uses `app/` as one of several workspace packages
  # (alongside shell/, shared/, native/diff), with the real app entry
  # point at out/main/index.js (root package.json's `main` field). We
  # override to the workspace root so the asar packer doesn't trip on
  # workspace siblings like shared/package.json being "outside" app/.
  app: .

files:
  - out/**
  - package.json
  # The napi-rs diff core lives in the workspace as a separate package
  # (@skrive/diff). electron-builder follows workspace deps, but the
  # produced .node binary needs to be explicitly included so it survives
  # the asar pack.
  - native/diff/index.js
  - native/diff/index.d.ts
  - native/diff/package.json
  - native/diff/*.node

# Native modules can't be loaded from inside an asar archive — the OS
# loader needs a real file path. asarUnpack pulls the matched files
# back out into app.asar.unpacked/ so dlopen can find them.
asarUnpack:
  - "**/*.node"

mac:
  # DMG is the install medium (drag-to-Applications); zip is what
  # Squirrel.Mac (electron-updater) actually downloads + unpacks for
  # auto-updates. Shipping only DMG breaks autoUpdater with
  # "ZIP file not provided" against latest-mac.yml, since the updater
  # rejects the .dmg URL as an unsupported update package.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  # electron-builder also defaults to build/icon.icns when buildResources
  # is set, but naming it explicitly survives a future buildResources
  # rename.
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder reads APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD +
  # APPLE_TEAM_ID from the env when notarize: true is set. The CI
  # workflow maps these from the existing APPLE_* secrets. Local
  # builds without these env vars set will fail the notarize step;
  # use `bun run start` for dev — packaging is a CI-only path.
  notarize: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # v0.2 ships unsigned on Windows; signing is a post-port roadmap item.

# Drop the space from electron-builder's default NSIS filename
# ("Skrive Setup 0.2.0.exe") so the release workflow's stable-name
# alias step doesn't have to deal with quoting. The macOS DMG already
# uses the dash-separated default.
nsis:
  artifactName: ${productName}-${version}-Setup.${ext}

fileAssociations:
  - ext: md
    name: Markdown Document
    role: Editor
  - ext: markdown
    name: Markdown Document
    role: Editor

protocols:
  - name: Skrive
    schemes:
      - skrive

publish:
  provider: github
  owner: brueshi
  repo: Skrive
