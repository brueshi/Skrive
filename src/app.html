<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skrive</title>
    <style>
      :root {
        --skrive-bg: #f7f5f0;
        --skrive-fg: #1a1a1a;
        --skrive-muted: #6b6b6b;
        --skrive-link: #1a1a1a;
        --skrive-selection: rgba(26, 26, 26, 0.14);
        --skrive-rule: rgba(26, 26, 26, 0.08);
        /* Chrome strip behind the top bar — slightly darker than the
           editor cream so the active tab can lift to editor color and
           visually flow into the writing surface below. Notion's tab
           strip uses the same trick. */
        --skrive-chrome: #efece5;

        /* Editor typography. Defaults match the pre-Settings theme;
           +page.svelte rewrites these from `preferences` once app
           state hydrates so the editor surface only shows the user's
           pick after one frame, not the bare default first. */
        --skrive-editor-font:
          "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia",
          ui-serif, serif;
        --skrive-editor-font-size: 17px;
        --skrive-editor-line-height: 1.7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --skrive-bg: #131313;
          --skrive-fg: #f0ede5;
          --skrive-muted: #8a8a8a;
          --skrive-link: #f0ede5;
          --skrive-selection: rgba(240, 237, 229, 0.18);
          --skrive-rule: rgba(240, 237, 229, 0.1);
          /* Chrome lifts above editor in dark mode (lighter than bg) so
             the active tab — which matches editor — sinks visually and
             still reads as connected to the writing surface. */
          --skrive-chrome: #1a1a1a;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: var(--skrive-bg);
        color: var(--skrive-fg);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Inter",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
