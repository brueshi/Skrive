# Build + sign + publish Skrive on every `v*` tag push.
#
# macOS: aarch64 (Apple Silicon) .dmg, signed with a Developer ID
# Application cert and notarized. End users get a no-warning install
# as long as the cert + notarization secrets are present. Intel Macs
# run the binary under Rosetta 2 — Apple stopped selling Intel Macs
# in 2023 and a writing tool isn't perf-sensitive enough for translation
# overhead to bite, so dropping the universal target halves macOS Rust
# compile time per release.
#
# Windows: NSIS .exe installer, unsigned. SmartScreen warns on first
# run; users click "More info → Run anyway." Proper Windows code-
# signing is deferred until a public launch (EV cert cost + hardware
# token).
#
# The release is created as a draft so we can review and publish
# manually once the action finishes. electron-builder also uploads
# `latest-mac.yml` / `latest.yml` — the feed electron-updater polls.
# Don't publish the release until both files are present, or in-app
# update prompts will look broken.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual dispatch for testing the build without cutting a tag. No
  # release is created (--publish never); the signed, notarized build
  # is uploaded as a run artifact instead (see the upload step below),
  # so a packaged build can be dogfooded without touching the release
  # feed or existing users' updater.
  workflow_dispatch:

jobs:
  build:
    permissions:
      # electron-builder creates the GitHub Release and uploads the
      # bundles when invoked with --publish always.
      contents: write

    strategy:
      # Keep failures isolated so a Windows hiccup doesn't abort an
      # already-working macOS build.
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: mac
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            target: win
            rust-target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # napi-rs needs the Rust toolchain. macOS only builds aarch64;
      # Windows uses the runner's default toolchain (x86_64-pc-windows-msvc).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/diff

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # Build the napi-rs native module before electron-builder runs —
      # the .node file is what gets bundled into the app, not the Rust
      # source.
      - name: Build native (@skrive/diff)
        working-directory: native/diff
        run: bun run build

      # electron-builder reads the GitHub provider config from
      # electron-builder.yml. --publish always uploads to a draft
      # release plus generates latest-mac.yml / latest.yml for the
      # in-app updater feed.
      #
      # Env-var mapping for macOS signing + notarization:
      #   CSC_LINK / CSC_KEY_PASSWORD     ← APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD
      #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
      # On Windows these are unset; electron-builder skips signing.
      - name: Build, sign, notarize, publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bun run package:${{ matrix.target }} -- --publish ${{ github.event_name == 'push' && 'always' || 'never' }}

      # Upload version-less aliases of each platform's installer so the
      # landing page can link to stable URLs that resolve forever:
      #   github.com/brueshi/Skrive/releases/latest/download/Skrive.dmg
      # The originals stay in place; these are additional copies, not
      # replacements. electron-updater reads its own latest-mac.yml /
      # latest.yml and is unaffected by these aliases.
      - name: Upload stable-name aliases
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              SRC=$(find dist -maxdepth 2 -type f -name "Skrive-*.dmg" | head -1)
              if [[ -z "$SRC" ]]; then
                echo "No .dmg produced — skipping alias upload" >&2
                exit 0
              fi
              cp "$SRC" Skrive.dmg
              gh release upload "$TAG" Skrive.dmg --clobber
              ;;
            Windows)
              SRC_EXE=$(find dist -maxdepth 2 -type f -name "Skrive-*-Setup.exe" | head -1)
              if [[ -n "$SRC_EXE" ]]; then
                cp "$SRC_EXE" Skrive-setup.exe
                gh release upload "$TAG" Skrive-setup.exe --clobber
              fi
              ;;
            *)
              echo "Unknown runner OS: $RUNNER_OS" >&2
              ;;
          esac

      # Manual-dispatch only. Surfaces the signed, notarized installers
      # as a downloadable run artifact so a packaged build can be tested
      # for feel/performance WITHOUT cutting a tag, creating a release,
      # or exposing anything to the electron-updater feed. Nothing here
      # is published; the artifact expires on its own. The glob set is
      # union across platforms — the dmg/zip match on macOS, the Setup
      # .exe on Windows, and if-no-files-found:warn keeps the unmatched
      # patterns from failing the step.
      - name: Upload build artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: skrive-${{ matrix.target }}-dispatch
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup.exe
          if-no-files-found: warn
          retention-days: 14
