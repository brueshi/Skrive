[package]
name = "skrive_diff"
version = "0.1.0"
edition = "2021"
description = "Skrive structural + line-level Markdown diff, exposed to Node via napi-rs."
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
