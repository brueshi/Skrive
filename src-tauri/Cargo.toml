[package]
name = "skrive"
version = "0.1.0"
description = "A Markdown IDE for people who write seriously and ship to the web."
authors = ["Skrive contributors"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "skrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
thiserror = "1"
walkdir = "2"
notify = "6.1"
pulldown-cmark = "0.12"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
trash = "5"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
similar = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

